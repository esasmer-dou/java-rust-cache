name: Bundled Native Runtime Compatibility

# This release's hosted compatibility exception is not a Redis load/soak gate.
# K-001: JNI. Use committed bundled bytes; never rebuild/promote native code.
on:
  workflow_dispatch:
    inputs:
      rest_commit:
        description: Exact 40-character coordinated rust-java-rest commit (Java dependency only)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: native-runtime-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: OpenJ9 21 / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            architecture: x64
            binary: rust_hyper-windows-x64.dll
            rest_binary: rust_hyper.dll
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            architecture: aarch64
            binary: librust_hyper-linux-arm64.so
            rest_binary: librust_hyper.so
          - runner: macos-15
            platform: macos-arm64
            architecture: aarch64
            binary: librust_hyper-macos-arm64.dylib
            rest_binary: librust_hyper.dylib
    defaults:
      run:
        shell: pwsh
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REST_COMMIT: ${{ inputs.rest_commit }}
      EXPECTED_NATIVE_REVISION: 26ee9b9f518077af1fc0817c8f37a96fd1a78533
      PLATFORM: ${{ matrix.platform }}
      ARCHITECTURE: ${{ matrix.architecture }}
      NATIVE_BINARY: ${{ matrix.binary }}
      REST_BINARY: ${{ matrix.rest_binary }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require an immutable dependency checkout
        run: |
          if ($env:REST_COMMIT -cnotmatch '^[a-f0-9]{40}$') { throw 'rest_commit must be an exact commit SHA, not a moving branch/tag' }
      - uses: actions/checkout@v4
        with:
          repository: esasmer-dou/rust-java-rest
          ref: ${{ inputs.rest_commit }}
          path: compatibility-dependency/rust-java-rest
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: semeru
          java-version: '21'
          architecture: ${{ matrix.architecture }}
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Pin the cache binary, dependency and real JVM architecture
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path compatibility-evidence -Force | Out-Null
          $jvm = (& java -XshowSettings:properties -version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the test JVM' }
          $jvm | Set-Content compatibility-evidence/java.txt
          $archPattern = if ($env:ARCHITECTURE -eq 'aarch64') { '(aarch64|arm64)' } else { '(amd64|x86_64)' }
          if ($jvm -notmatch 'java\.vm\.name\s*=.*OpenJ9' -or
              $jvm -notmatch 'java\.version\s*=\s*21[.+\s]' -or
              $jvm -notmatch "os\.arch\s*=\s*$archPattern\s") { throw 'Expected native-architecture OpenJ9 Java 21; no emulation/fallback' }
          $dependency = 'compatibility-dependency/rust-java-rest'
          $actualCommit = (& git -C $dependency rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -cne $env:REST_COMMIT) { throw 'Dependency checkout mismatch' }
          [xml]$cachePom = Get-Content pom.xml -Raw
          [xml]$restPom = Get-Content "$dependency/pom.xml" -Raw
          if ($cachePom.project.properties.'rust-java-rest.version' -ne $restPom.project.version) { throw 'Cache/REST Maven version mismatch' }
          $root = 'src/main/resources/native/native-provenance.properties'
          $sidecar = "src/main/resources/native/$env:PLATFORM/native-provenance.properties"
          $binary = "src/main/resources/native/$env:PLATFORM/$env:NATIVE_BINARY"
          $sha = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          foreach ($path in @($root, $sidecar)) {
            $metadata = ConvertFrom-StringData (Get-Content -LiteralPath $path -Raw)
            if ($metadata.schema -ne '2' -or $metadata['source.revision'] -ne $env:EXPECTED_NATIVE_REVISION -or
                $metadata["$env:PLATFORM.sha256"] -ne $sha -or $metadata['runtime.verified'] -ne 'false') {
              throw "Bundled provenance mismatch: $path"
            }
          }
          if ((Get-FileHash "$dependency/src/main/resources/native/$env:PLATFORM/$env:REST_BINARY" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha) { throw 'REST/cache native byte mismatch' }
          @{
            repository = $env:GITHUB_REPOSITORY; commit = $env:GITHUB_SHA; rest_commit = $actualCommit
            platform = $env:PLATFORM; native_source_revision = $env:EXPECTED_NATIVE_REVISION
            binary = $binary; sha256 = $sha
            root_sha256 = (Get-FileHash $root -Algorithm SHA256).Hash.ToLowerInvariant()
            sidecar_sha256 = (Get-FileHash $sidecar -Algorithm SHA256).Hash.ToLowerInvariant()
            scope = 'hosted-runtime-compatibility-only'; metadata_promoted = $false
            redis_network_tested = $false
          } | ConvertTo-Json | Set-Content compatibility-evidence/input.json
      - name: Install only the coordinated Java dependencies, without running their tests
        run: |
          foreach ($project in @('compatibility-dependency/rust-java-rest/pom.xml',
              'compatibility-dependency/rust-java-rest/platform/jdbc/pom.xml')) {
            & mvn -B -ntp -f $project -DskipTests install 2>&1 | Tee-Object -Append compatibility-evidence/dependencies.log
            if ($LASTEXITCODE -ne 0) { throw "Java dependency installation failed: $project" }
          }
      - name: Native Redis ABI-6 client lifecycle/metrics and cache-owned packaged loader
        run: |
          # No Redis server or load test: create read/write planes, inspect JNI metrics,
          # reject forbidden operations and close. Excluding REST forces cache extraction.
          $extract = Join-Path $env:RUNNER_TEMP 'cache-native-compatibility'
          $tests = 'NativeRedisBridgePlatformTest,NativeCacheProvenanceTest,PackagedNativeProvenanceConsistencyTest,RustCacheNativeIntegrationTest#allocatesOnlyTheConfiguredTransportPlane'
          $arguments = @('-B', '-ntp', 'clean', 'verify', "-Dtest=$tests",
            '-Dreactor.cache.redis.integration=true', '-Dmaven.test.dependency.excludes=com.reactor:rust-java-rest',
            "-Dreactor.cache.native.extract-dir=$extract",
            '-DforkCount=1', '-DreuseForks=false', '-DfailIfNoTests=true', '-Dsurefire.failIfNoSpecifiedTests=true')
          & mvn @arguments 2>&1 | Tee-Object compatibility-evidence/maven.log
          if ($LASTEXITCODE -ne 0) { throw 'Bundled native cache compatibility checks failed' }
      - name: Require executed checks and retain an exact compatibility receipt
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @('com.reactor.rust.cache.internal.nativebridge.NativeRedisBridgePlatformTest',
            'com.reactor.rust.cache.internal.nativebridge.NativeCacheProvenanceTest',
            'com.reactor.rust.cache.internal.nativebridge.PackagedNativeProvenanceConsistencyTest',
            'com.reactor.rust.cache.core.RustCacheNativeIntegrationTest')
          $results = @(Get-ChildItem target/surefire-reports/TEST-*.xml | ForEach-Object {
            [xml]$report = Get-Content -LiteralPath $_.FullName -Raw
            $suite = $report.testsuite
            if ([int]$suite.tests -le 0 -or [int]$suite.failures -ne 0 -or
                [int]$suite.errors -ne 0 -or [int]$suite.skipped -ne 0) { throw "Unexecuted/failing checks: $($suite.name)" }
            @{ suite = [string]$suite.name; tests = [int]$suite.tests; failures = [int]$suite.failures
              errors = [int]$suite.errors; skipped = [int]$suite.skipped }
          })
          foreach ($name in $expected) {
            if (@($results | Where-Object { $_.suite -eq $name }).Count -ne 1) { throw "Missing suite: $name" }
          }
          $input = Get-Content compatibility-evidence/input.json -Raw | ConvertFrom-Json
          if ((Get-FileHash $input.binary -Algorithm SHA256).Hash.ToLowerInvariant() -ne $input.sha256) { throw 'Native bytes changed during Java build' }
          $extracted = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'cache-native-compatibility') -Recurse -File |
            Where-Object { $_.Name -eq $env:NATIVE_BINARY })
          if ($extracted.Count -ne 1 -or (Get-FileHash $extracted[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $input.sha256) { throw 'Cache did not extract the pinned bundled native binary' }
          [xml]$pom = Get-Content pom.xml -Raw
          $jar = "target/java-rust-cache-$($pom.project.version).jar"
          & git diff --exit-code -- src/main/resources/native
          if ($LASTEXITCODE -ne 0) { throw 'Native bytes or provenance changed' }
          @{ input = $input; result = 'PASS'; suites = $results
             jar = $jar; jar_sha256 = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLowerInvariant()
             measured_performance = $false; soak_tested = $false } |
            ConvertTo-Json -Depth 8 | Set-Content compatibility-evidence/result.json
          'Cache JNI load/lifecycle/metrics only; no Redis-network, performance/soak claim or metadata promotion.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload compatibility evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-native-compatibility-${{ matrix.platform }}-${{ github.sha }}
          path: |
            compatibility-evidence/
            target/surefire-reports/
          if-no-files-found: error
          retention-days: 30
