name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.7.2"
        required: true
        type: string
      repair_partial_package:
        description: "Delete and republish an incomplete GitHub Packages version"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check out the requested release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          git fetch --force --tags
          git checkout --detach "v${{ steps.version.outputs.version }}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Checkout aligned rust-java-rest
        uses: actions/checkout@v4
        with:
          repository: esasmer-dou/rust-java-rest
          ref: v4.4.0
          path: rust-java-rest-dependency

      - name: Install aligned rust-java-rest locally
        run: mvn -B -ntp -f rust-java-rest-dependency/pom.xml -DskipTests install

      - name: Test
        run: mvn -B -ntp test

      - name: Verify release version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PROJECT_VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          test "$VERSION" = "$PROJECT_VERSION"

      - name: Verify native release provenance
        shell: bash
        run: |
          MANIFEST="src/main/resources/native/native-provenance.properties"
          test -f "$MANIFEST"
          grep -qx 'schema=2' "$MANIFEST"
          grep -qx 'rest.abi=28' "$MANIFEST"
          grep -qx 'dubbo.abi=7' "$MANIFEST"
          grep -qx 'redis.abi=6' "$MANIFEST"
          grep -qx 'glowroot.abi=1' "$MANIFEST"
          grep -Eq '^source.revision=[0-9a-f]{40}$' "$MANIFEST"
          ! grep -q -- '-dirty$' "$MANIFEST"
          LINUX_EXPECTED="$(sed -n 's/^linux-x64.sha256=//p' "$MANIFEST")"
          WINDOWS_EXPECTED="$(sed -n 's/^windows-x64.sha256=//p' "$MANIFEST")"
          test "$(sha256sum src/main/resources/native/linux-x64/librust_hyper-linux-x64.so | awk '{print $1}')" = "$LINUX_EXPECTED"
          test "$(sha256sum src/main/resources/native/windows-x64/rust_hyper-windows-x64.dll | awk '{print $1}')" = "$WINDOWS_EXPECTED"

      - name: Remove incomplete Maven package version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_partial_package }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          API_PATH="/users/${GITHUB_REPOSITORY_OWNER}/packages/maven/com.reactor.java-rust-cache/versions"
          VERSION_ID="$(gh api --paginate "${API_PATH}?per_page=100" --jq ".[] | select(.name == \"${VERSION}\") | .id" | head -n 1)"
          if [ -n "${VERSION_ID}" ]; then
            gh api --method DELETE "${API_PATH}/${VERSION_ID}"
          fi
          for attempt in $(seq 1 12); do
            REMAINING="$(gh api --paginate "${API_PATH}?per_page=100" --jq ".[] | select(.name == \"${VERSION}\") | .id" | head -n 1)"
            if [ -z "${REMAINING}" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Package version ${VERSION} was not deleted in time" >&2
          exit 1

      - name: Publish Maven package
        run: >-
          mvn -B -ntp -DskipTests
          -DretryFailedDeploymentCount=5
          -Daether.connector.basic.threads=1
          -Dmaven.wagon.http.retryHandler.count=5
          deploy

      - name: Prepare release assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release-assets
          cp "target/java-rust-cache-${VERSION}.jar" release-assets/
          cp "target/java-rust-cache-${VERSION}-codegen.jar" release-assets/
          cp "target/java-rust-cache-${VERSION}-sources.jar" release-assets/
          cp "src/main/resources/native/windows-x64/rust_hyper-windows-x64.dll" release-assets/
          cp "src/main/resources/native/linux-x64/librust_hyper-linux-x64.so" release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          body_path: docs/RELEASE_NOTES_v${{ steps.version.outputs.version }}.md
          files: release-assets/*
